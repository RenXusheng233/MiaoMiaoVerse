[project]
name = "miaomiaoverse-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.139.2",
    "uvicorn>=0.51.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.9",
    "langchain-community>=0.4.2",
    "langchain-deepseek>=1.1.0",
    "sentence-transformers>=5.7.0",
    "sqlmodel>=0.0.39",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
